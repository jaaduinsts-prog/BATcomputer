name: private_agent
description: "BATcomputer - Autonomous AI Companion."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  speech_to_text: ^6.7.0
  flutter_tts: ^4.2.1
  installed_apps: ^2.1.1
  url_launcher: ^6.3.0
  android_intent_plus: ^5.2.0
  flutter_contacts: ^1.1.9
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.4
  volume_controller: ^3.0.0
  screen_brightness: ^2.1.0
  shizuku_api: ^1.2.2
  share_plus: ^9.0.0
  intl: ^0.19.0
  flutter_markdown_plus: ^1.0.12
  flutter_overlay_window: ^0.5.0
  uuid: ^4.5.1
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/genie_logo.png
    - assets/images/
