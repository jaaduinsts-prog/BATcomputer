name: Build BATcomputer Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BATcomputer Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Automatically uses the latest stable Flutter SDK supporting Dart 3.12+

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Compiled BATcomputer APK
        uses: actions/upload-artifact@v4
        with:
          name: BATcomputer-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
